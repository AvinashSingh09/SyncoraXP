steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/syncoraxp-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/syncoraxp-api:latest'
      - '-f'
      - 'apps/api/Dockerfile'
      - '.'

images:
  - 'gcr.io/$PROJECT_ID/syncoraxp-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/syncoraxp-api:latest'
