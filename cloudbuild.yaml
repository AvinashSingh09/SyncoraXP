steps:
  # Build Web Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/syncoraxp-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/syncoraxp-web:latest'
      - '-f'
      - 'apps/web/Dockerfile'
      - '.'

  # Build API Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/syncoraxp-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/syncoraxp-api:latest'
      - '-f'
      - 'apps/api/Dockerfile'
      - '.'

images:
  - 'gcr.io/$PROJECT_ID/syncoraxp-web:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/syncoraxp-web:latest'
  - 'gcr.io/$PROJECT_ID/syncoraxp-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/syncoraxp-api:latest'
